name: Deploy to Google Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - closed
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build & Deploy Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          missing=0
          for var in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD GOOGLE_SERVICES_JSON_BASE64 PLAY_STORE_JSON_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required repository secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Add missing secrets at: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          python3 -c 'import base64, os; data = "".join(os.environ["KEYSTORE_BASE64"].lstrip("\ufeff").split()); open("android/app/upload-keystore.jks", "wb").write(base64.b64decode(data))'

      - name: Restore key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          python3 -c '
          import os
          def clean(name, prefix):
              v = os.environ[name].strip()
              if v.startswith(prefix):
                  v = v[len(prefix):].strip()
              return v
          sp = clean("STORE_PASSWORD", "storePassword=")
          kp = clean("KEY_PASSWORD", "keyPassword=")
          ka = clean("KEY_ALIAS", "keyAlias=")
          with open("android/key.properties", "w", encoding="utf-8") as f:
              f.write(f"storePassword={sp}\nkeyPassword={kp}\nkeyAlias={ka}\nstoreFile=upload-keystore.jks\n")
          '

      - name: Verify Keystore & Signing Config
        run: |
          python3 -c '
          import os, subprocess
          print("Keystore bytes:", os.path.getsize("android/app/upload-keystore.jks"))
          props = dict(line.strip().split("=", 1) for line in open("android/key.properties") if "=" in line)
          for k in ("storePassword", "keyPassword", "keyAlias", "storeFile"):
              print(f"{k} length:", len(props.get(k, "")))
          '
          cat << 'EOF' > /tmp/CheckKS.java
          import java.io.*;
          import java.security.*;
          import java.util.*;
          public class CheckKS {
            public static void main(String[] args) throws Exception {
              Properties p = new Properties();
              try (var in = new FileInputStream("android/key.properties")) { p.load(in); }
              File f = new File("android/app/" + p.getProperty("storeFile"));
              KeyStore ks = KeyStore.getInstance(f, p.getProperty("storePassword").toCharArray());
              String alias = p.getProperty("keyAlias");
              Key k = ks.getKey(alias, p.getProperty("keyPassword").toCharArray());
              if (k == null) {
                System.err.println("::error::Key alias not found in keystore! Available aliases: " + Collections.list(ks.aliases()));
                System.exit(1);
              }
              System.out.println("Java KeyStore signing check PASSED.");
            }
          }
          EOF
          java /tmp/CheckKS.java

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 -c 'import base64, os; data = "".join(os.environ["GOOGLE_SERVICES_JSON_BASE64"].lstrip("\ufeff").split()); open("android/app/google-services.json", "wb").write(base64.b64decode(data))'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Artifact to GitHub (Backup Download)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.ltoexamcoach.philippines
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'production' }}
          status: 'completed'
          whatsNewDirectory: distribution/whatsnew
